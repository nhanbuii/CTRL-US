 text-label-md font-bold shadow-xs transition-all\" id=\"tab-my-qr\" type=\"button\">\n          Mã QR Của Bạn\n        \u003c/button>\n\u003cbutton class=\"flex-1 py-1.5 rounded-lg text-on-surface-variant font-label-md text-label-md font-medium hover:text-primary transition-all\" id=\"tab-scan-qr\" type=\"button\">\n          Quét Bạn Chat\n        \u003c/button>\n\u003c/div>\n\u003c!-- Tab Content 1: My Personal QR Screen -->\n\u003cdiv class=\"flex flex-col items-center text-center space-y-3 py-2\" id=\"content-my-qr\">\n\u003cdiv class=\"p-3 bg-surface-container-low border-2 border-dashed border-secondary/40 rounded-2xl relative shadow-inner\">\n\u003c!-- Synthetic High-Precision QR Canvas Placeholder -->\n\u003cdiv class=\"w-52 h-52 bg-white rounded-xl p-3 flex flex-col justify-between items-center shadow-xs\">\n\u003cdiv class=\"w-full flex justify-between\">\n\u003cdiv class=\"w-10 h-10 border-4 border-primary rounded-md p-1\">\u003cdiv class=\"w-full h-full bg-primary\">\u003c/div>\u003c/div>\n\u003cdiv class=\"w-10 h-10 border-4 border-primary rounded-md p-1\">\u003cdiv class=\"w-full h-full bg-primary\">\u003c/div>\u003c/div>\n\u003c/div>\n\u003c!-- Center HCMUS Crest Symbol -->\n\u003cdiv class=\"w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center text-primary font-bold border border-secondary shadow-xs\">\n\u003cspan class=\"material-symbols-outlined text-[24px]\">school\u003c/span>\n\u003c/div>\n\u003cdiv class=\"w-full flex justify-between items-end\">\n\u003cdiv class=\"w-10 h-10 border-4 border-primary rounded-md p-1\">\u003cdiv class=\"w-full h-full bg-primary\">\u003c/div>\u003c/div>\n\u003cdiv class=\"w-8 h-8 grid grid-cols-2 gap-1 p-0.5\">\n\u003cdiv class=\"bg-primary\">\u003c/div>\u003cdiv class=\"bg-primary\">\u003c/div>\n\u003cdiv class=\"bg-primary\">\u003c/div>\u003cdiv class=\"bg-secondary\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c!-- Pulse Ping Indicator -->\n\u003cspan class=\"absolute -top-1 -right-1 flex h-3 w-3\">\n\u003cspan class=\"animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary-container opacity-75\">\u003c/span>\n\u003cspan class=\"relative inline-flex rounded-full h-3 w-3 bg-secondary\">\u003c/span>\n\u003c/span>\n\u003c/div>\n\u003cdiv class=\"space-y-1\">\n\u003cp class=\"font-headline-sm text-[16px] text-on-surface font-bold\">Đưa mã này cho \u003cspan class=\"text-primary\">Nguyễn Hoàng Nam\u003c/span> quét\u003c/p>\n\u003cp class=\"font-body-sm text-body-sm text-outline\">Mã tự làm mới sau 30 giây để xác thực vị trí GPS\u003c/p>\n\u003c/div>\n\u003cdiv class=\"w-full bg-surface-container-low p-3 rounded-xl flex items-center space-x-3 text-left\">\n\u003cspan class=\"material-symbols-outlined text-secondary text-[20px]\">location_on\u003c/span>\n\u003cdiv class=\"flex-1\">\n\u003cdiv class=\"font-label-sm text-label-sm text-on-surface font-semibold\">Vị trí hiện tại: Cơ sở Nguyễn Văn Cừ\u003c/div>\n\u003cdiv class=\"font-body-sm text-[11px] text-outline\">Bán kính hợp lệ: &lt; 50m trong trường\u003c/div>\n\u003c/div>\n\u003cspan class=\"material-symbols-outlined text-secondary text-[18px]\">check_circle\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c!-- Tab Content 2: Camera Scanner View (Hidden by default) -->\n\u003cdiv class=\"hidden flex-col items-center space-y-3 py-2\" id=\"content-scan-qr\">\n\u003cdiv class=\"relative w-full h-56 bg-inverse-surface rounded-2xl overflow-hidden flex items-center justify-center border border-outline\">\n\u003c!-- Viewfinder Frame -->\n\u003cdiv class=\"w-40 h-40 border-2 border-secondary-container rounded-xl relative flex items-center justify-center\">\n\u003cdiv class=\"absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-secondary-container\">\u003c/div>\n\u003cdiv class=\"absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-secondary-container\">\u003c/div>\n\u003cdiv class=\"absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-secondary-container\">\u003c/div>\n\u003cdiv class=\"absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-secondary-container\">\u003c/div>\n\u003c!-- Laser scan animation -->\n\u003cdiv class=\"w-full h-0.5 bg-secondary-container shadow-[0_0_8px_#00affe] animate-bounce\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"absolute bottom-3 text-white text-xs bg-black/60 px-3 py-1 rounded-full font-label-sm\">\n            Hướng camera vào mã QR của Nam\n          \u003c/div>\n\u003c/div>\n\u003cp class=\"font-body-sm text-body-sm text-outline text-center\">\n          Giữ máy cố định. Khi phát hiện mã QR, hệ thống sẽ mở khóa chat vĩnh viễn và cộng 50 điểm rèn luyện!\n        \u003c/p>\n\u003c/div>\n\u003c!-- Modal Footer -->\n\u003cbutton class=\"w-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg py-3 rounded-lg shadow-sm transition-transform active:scale-98 flex items-center justify-center space-x-2\" id=\"confirm-checkin-btn\" type=\"button\" data-nav=\"04-rewards.html\" onclick=\"__go('04-rewards.html')\">\n\u003cspan class=\"material-symbols-outlined text-[20px]\">lock_open\u003c/span>\n\u003cspan class=\"\">Xác Nhận &amp; Mở Khóa Vĩnh Viễn\u003c/span>\n\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c!-- Inline Interaction Logic -->\n\u003cscript>\n    // QR Modal Controls\n    const qrModal = document.getElementById('qr-modal');\n    const openBtn = document.getElementById('open-qr-modal-btn');\n    const quickQrBtn = document.getElementById('quick-qr-icon-btn');\n    const closeBtn = document.getElementById('close-qr-modal-btn');\n    const confirmBtn = document.getElementById('confirm-checkin-btn');\n\n    const tabMyQr = document.getElementById('tab-my-qr');\n    const tabScanQr = document.getElementById('tab-scan-qr');\n    const contentMyQr = document.getElementById('content-my-qr');\n    const contentScanQr = document.getElementById('content-scan-qr');\n\n    const showModal = () => qrModal.classList.remove('hidden');\n    const hideModal = () => qrModal.classList.add('hidden');\n\n    if(openBtn) openBtn.addEventListener('click', showModal);\n    if(quickQrBtn) quickQrBtn.addEventListener('click', showModal);\n    if(closeBtn) closeBtn.addEventListener('click', hideModal);\n\n    // Tab toggle logic\n    tabMyQr.addEventListener('click', () => {\n      tabMyQr.className = \"flex-1 py-1.5 rounded-lg bg-surface-container-lowest text-primary font-label-md text-label-md font-bold shadow-xs transition-all\";\n      tabScanQr.className = \"flex-1 py-1.5 rounded-lg text-on-surface-variant font-label-md text-label-md font-medium hover:text-primary transition-all\";\n      contentMyQr.classList.remove('hidden');\n      contentScanQr.classList.add('hidden');\n    });\n\n    tabScanQr.addEventListener('click', () => {\n      tabScanQr.className = \"flex-1 py-1.5 rounded-lg bg-surface-container-lowest text-primary font-label-md text-label-md font-bold shadow-xs transition-all\";\n      tabMyQr.className = \"flex-1 py-1.5 rounded-lg text-on-surface-variant font-label-md text-label-md font-medium hover:text-primary transition-all\";\n      contentScanQr.classList.remove('hidden');\n      contentMyQr.classList.add('hidden');\n    });\n\n    if(confirmBtn) {\n      confirmBtn.addEventListener('click', () => {\n        alert('🎉 Chúc mừng! Hai bạn đã check-in thành công tại Căn tin B! Mở khóa Chat vĩnh viễn và nhận 50 điểm.');\n        hideModal();\n      });\n    }\n\n    // Dynamic Countdown simulation\n    let totalSeconds = 18 * 3600 + 42 * 60 + 15;\n    const timerElement = document.getElementById('countdown-timer');\n\n    setInterval(() => {\n      if (totalSeconds > 0) {\n        totalSeconds--;\n        const hours = Math.floor(totalSeconds / 3600);\n        const minutes = Math.floor((totalSeconds % 3600) / 60);\n        const seconds = totalSeconds % 60;\n        const pad = (n) => String(n).padStart(2, '0');\n        if (timerElement) {\n          timerElement.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)} còn lại`;\n        }\n      }\n    }, 1000);\n  \u003c/script>\n\n\n\u003c/body>\u003c/html>", "04-rewards": "\u003c!DOCTYPE html>\u003chtml class=\"light\" lang=\"vi\">\u003chead>\u003cscript>\nwindow.__go=function(f){parent.postMessage({hcmusGo:String(f).replace(/\\.html$/,'')},'*');};\ndocument.addEventListener('click',function(e){\n  var a=e.target.closest&&e.target.closest('a[href]');\n  if(!a)return; var h=a.getAttribute('href')||'';\n  if(/^\\d\\d-[a-z0-9-]+\\.html$/.test(h)){e.preventDefault();window.__go(h);}\n  else if(h==='#'||h.charAt(0)==='#'){e.preventDefault();}\n},true);\n\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\">\n\u003ctitle>HCMUS Connect - Chuỗi Tuần &amp; Đổi Thưởng Voucher\u003c/title>\n\u003c!-- Fonts -->\n\u003clink href=\"https://fonts.googleapis.com\" rel=\"preconnect\">\n\u003clink crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap\" rel=\"stylesheet\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\n\u003c!-- Tailwind CSS -->\n\u003cscript src=\"https://cdn.tailwindcss.com?plugins=forms,container-queries\">\u003c/script>\n\u003cscript id=\"tailwind-config\">\n    tailwind.config = {\n      darkMode: \"class\",\n      theme: {\n        extend: {\n          \"colors\": {\n            \"on-secondary-fixed-variant\": \"#004b70\",\n            \"primary-fixed\": \"#d9e2ff\",\n            \"surface-container-lowest\": \"#ffffff\",\n            \"on-tertiary-container\": \"#59c8ff\",\n            \"surface-container\": \"#eaedff\",\n <script>
(function(){
  var screens=JSON.parse(document.getElementById('screens').textContent);
  var view=document.getElementById('view'), cur=null, DEFAULT='00-login';
  function route(){
    var id=(location.hash||'').replace(/^#\/?/,'');
    if(!screens[id])id=DEFAULT;
    if(id===cur)return; cur=id; view.srcdoc=screens[id];
  }

  });
  window.addEventListener('hashchange',route);
  route();
})();
</script>
